name: POS Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        # Pointing explicitly to the app directory paths
        pip install -r app/requirements.txt
        pip install pytest PyJWT "pwdlib[argon2]"

    - name: Run complete test suite
      run: |
        # Explicitly targets pytest inside the app/ subfolder
        python -m pytest app/
